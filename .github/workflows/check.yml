name: Check (Dev)

# dev 分支快速檢查，不編譯全部平台
on:
  push:
    branches: [dev, 'feature/*']
  pull_request:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('rust/Cargo.lock') }}
      
      - name: Build
        working-directory: rust
        run: cargo build
      
      - name: Test
        working-directory: rust
        run: cargo test
