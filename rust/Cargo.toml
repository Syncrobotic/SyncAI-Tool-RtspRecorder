[package]
name = "rtsp-recorder"
version = "0.1.0"
edition = "2021"
description = "RTSP recorder with GCS upload support"
authors = ["Daniel Chen"]

[dependencies]
# CLI 參數解析
clap = { version = "4", features = ["derive"] }

# 非同步運行時
tokio = { version = "1", features = ["full"] }

# 設定檔解析
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# 時間處理
chrono = { version = "0.4", features = ["serde"] }

# 日誌
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GCS 上傳
cloud-storage = "0.11"

# 錯誤處理
anyhow = "1"
thiserror = "1"

# 目錄路徑
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
